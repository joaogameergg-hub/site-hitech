
name: Publicar Portfolio Angular

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npx ng build --configuration production --base-href /site-hitech/
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Preparar rotas
        run: |
          if [ -f dist/site-hitech/browser/index.html ]; then
            cp dist/site-hitech/browser/index.html dist/site-hitech/browser/404.html
          fi

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site-hitech/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

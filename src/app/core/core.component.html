
<a class="skip-link" href="#conteudo" (click)="skipToContent($event)">
  Pular para o conteúdo
</a>

<header>
  <!-- Barra superior -->
  <div class="top-bar">
    <span>UTFPR | Campus Curitiba</span>
    <span>João Paulo Guilherme Silva</span>
  </div>

  <!-- Navegação principal -->
  <nav>
    <a class="logo" routerLink="/" aria-label="João Paulo, página inicial">
      <img
        [src]="templateText.LogoEmpresa.src"
        alt="Logotipo do portfólio de João Paulo"
      />
    </a>

    <ul class="nav-links">
      <li>
        <a routerLink="/" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          Início
        </a>
      </li>

      <li>
        <a routerLink="/about" routerLinkActive="active">
          Sobre Mim
        </a>
      </li>

      <li>
        <a routerLink="/services" routerLinkActive="active">
          Conhecimentos
        </a>
      </li>

      <li>
        <a routerLink="/contact" routerLinkActive="active">
          Contato
        </a>
      </li>
    </ul>
  </nav>
</header>

<main id="conteudo" tabindex="-1">
  <ng-content></ng-content>
</main>
